# 개발/테스트 단계: Free 플랜 (콜드스타트 있음, 재배포/재시작마다 데이터 초기화).
# 회사 정식 배포 시 plan: starter + disk 블록을 추가해 상시 구동 + 영구 디스크로 전환하세요.
services:
  - type: web
    name: drawing-qc-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: UPLOAD_TOKEN_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATA_DIR
        value: ./data
      - key: MAX_DRAWING_MB
        value: "150"
